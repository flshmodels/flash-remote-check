name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python flash_remote_check.py examples/observed-checks.server.luau --format json
  examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install example compiler on the CI runner
        run: |
          curl --fail --location --retry 3 -o lune.zip https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip
          unzip -q lune.zip -d tools
          chmod +x tools/lune
      - run: ./tools/lune run tests/compile_examples
